<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メルカリ販売管理システム</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #B3E5FC;
            --card-bg: #F5F5F5;
            --accent-blue: #2196F3;
            --accent-orange: #FF7043;
            --accent-green: #66BB6A;
            --mercari-red: #FF0000;
            --clay-shadow: 10px 10px 20px rgba(0,0,0,0.06), inset -6px -6px 10px rgba(0,0,0,0.03), inset 6px 6px 10px rgba(255,255,255,0.8);
            --btn-shadow: 4px 4px 8px rgba(0,0,0,0.08), inset -2px -2px 4px rgba(0,0,0,0.08), inset 2px 2px 4px rgba(255,255,255,0.5);
        }
        * { box-sizing: border-box; }
        html, body { 
            background-color: var(--bg-color); 
            font-family: 'Noto Sans JP', sans-serif; 
            margin: 0; 
            padding: 0;
            display: flex; 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
            color: #333; 
        }                
        nav { 
            width: 240px; 
            min-width: 240px;
            padding: 16px 14px; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            z-index: 100; 
            overflow-y: auto; 
            height: 100vh;
        }
        .logo { font-size: 1.8rem; font-weight: 900; margin-bottom: 6px; color: #1A237E; cursor: pointer; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); }                
        .menu-btn {            
            background: var(--accent-blue); color: white; padding: 9px 12px; border-radius: 14px;            
            text-align: center; border: none; box-shadow: var(--btn-shadow); cursor: pointer; font-weight: 700; transition: 0.2s;            
            font-size: 0.85rem; width: 100%; display: flex; justify-content: space-between; align-items: center;
        }        
        .menu-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .upload-label { background: white; color: var(--accent-blue); font-size: 0.75rem; border: 2px solid #BBDEFB; margin-top: 2px; cursor: pointer; border-radius: 12px; padding: 7px; text-align: center; box-shadow: var(--btn-shadow); display: block; font-weight: 700; }
        .run-btn { background: var(--accent-orange) !important; margin-top: 2px; font-size: 0.95rem; padding: 9px !important; justify-content: center !important; }
        
        main { 
            flex: 1; 
            padding: 12px 20px 14px 20px; 
            display: flex; 
            flex-direction: column; 
            height: 100vh;
            overflow: hidden;
            width: 100%;
        }                
        header { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            margin-bottom: 10px; 
            flex-wrap: nowrap; 
            height: 42px;
            min-height: 42px;
        }
        .header-widget {            
            padding: 6px 16px; border-radius: 12px; font-weight: 900; font-size: 0.95rem;            
            box-shadow: var(--clay-shadow); border: 2px solid rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center; height: 100%;       
        }
        .mercari-logo { background: var(--mercari-red); color: white; min-width: 130px; letter-spacing: 3px; }
        .stat-stock { background: #000; color: white; min-width: 150px; }
        .stat-sales { background: #448AFF; color: white; min-width: 150px; }
        .clock-card { background: #64B5F6; color: white; margin-left: auto; border-radius: 40px; font-size: 0.88rem; padding: 6px 18px; box-shadow: var(--clay-shadow); font-weight: 700; height: 100%; display: flex; align-items: center; }
        
        .copy-source-btn {
            background: #455A64; color: white; border: none; padding: 6px 14px; border-radius: 40px;
            font-size: 0.8rem; font-weight: 700; cursor: pointer; box-shadow: var(--btn-shadow);
            transition: 0.2s; display: flex; align-items: center; gap: 6px; height: 100%;
        }
        .copy-source-btn:hover { background: #37474F; transform: translateY(-1px); }

        .page-content { 
            display: none; 
            width: 100%; 
            flex: 1;
            height: calc(100vh - 66px);
            animation: fadeIn 0.2s; 
        }
        .active-page { display: flex; flex-direction: column; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .manual-input-box {
            background: #ffffff;
            border-radius: 16px;
            padding: 8px 16px;
            margin-bottom: 10px;
            box-shadow: var(--clay-shadow);
            display: flex;
            align-items: center;
            gap: 10px;
            border: 2px solid #E1F5FE;
            height: 46px;
            min-height: 46px;
        }
        .manual-input-box label {
            font-weight: 900;
            color: #0277BD;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .manual-input-box input[type="text"] {
            padding: 5px 12px;
            border: 2px solid #B3E5FC;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 700;
            width: 130px;
            outline: none;
            transition: 0.2s;
            text-align: center;
            letter-spacing: 2px;
        }
        .manual-input-box input[type="text"]:focus {
            border-color: var(--accent-blue);
        }
        .manual-btn {
            background: var(--accent-orange);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: var(--btn-shadow);
            transition: 0.2s;
            white-space: nowrap;
            font-size: 0.82rem;
        }
        .manual-btn:hover { filter: brightness(1.1); }
        .manual-hint {
            font-size: 0.75rem;
            color: #78909C;
            margin-left: auto;
        }
        
        .dashboard-grid { 
            display: grid; 
            grid-template-columns: repeat(12, 1fr); 
            grid-template-rows: 1fr 1fr;
            gap: 10px; 
            flex: 1;
            height: calc(100% - 56px);
            min-height: 0;
        }
        .col-inv { grid-column: span 5; }
        .col-type { grid-column: span 4; }
        .col-ship { grid-column: span 3; }
        .col-sales { grid-column: span 7; }
        .col-recent-sales { grid-column: span 5; }

        .card { 
            background: var(--card-bg); 
            border-radius: 18px; 
            padding: 8px 12px; 
            box-shadow: var(--clay-shadow); 
            border: 3px solid white; 
            display: flex; 
            flex-direction: column; 
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }
        .card h3 { 
            margin: 0 0 2px 0; 
            color: #555; 
            font-size: 0.84rem; 
            font-weight: 900; 
            flex-shrink: 0;
        }
        .chart-container { 
            position: relative; 
            flex: 1;
            width: 100%; 
            min-height: 0;
        }

        /* 그래프 높이 최대 확장 */
        .sales-chart-container {
            position: relative;
            flex: 1;
            width: 100%;
            min-height: 0;
        }

        /* 여백 완전 제거 및 2배 크기 뱃지 최적화 */
        .monthly-summary-wrapper {
            margin: 0;
            padding: 0;
            border-top: 1px dashed #CFD8DC;
            user-select: text;
            flex-shrink: 0;
        }
        .monthly-summary-title {
            font-size: 0.85rem;
            color: #546E7A;
            font-weight: 800;
            margin: 1px 0 2px 0;
            line-height: 1.1;
        }
        .monthly-summary-container {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 0 0 1px 0;
            margin: 0;
        }
        .monthly-data-badge {
            background: white;
            border-radius: 8px;
            padding: 4px 8px;
            box-shadow: 1px 1px 4px rgba(0,0,0,0.05);
            font-size: 1.2rem;
            line-height: 1.2;
            white-space: nowrap;
            user-select: text;
            flex-shrink: 0;
        }
        .badge-month {
            font-weight: 900;
            color: #263238;
            font-size: 1.25rem;
            margin: 0 0 1px 0;
            border-bottom: 2px solid #ECEFF1;
            padding: 0 0 1px 0;
            text-align: center;
        }
        .badge-rev { color: #1565C0; font-weight: 800; margin: 0; }
        .badge-cost { color: #C62828; font-weight: 800; margin: 0; }
        .badge-profit { color: #2E7D32; font-weight: 900; margin: 0; }
        
        .table-card { 
            background: white; 
            border-radius: 20px; 
            padding: 16px; 
            box-shadow: var(--clay-shadow); 
            border: 3px solid white; 
            overflow: auto;
            flex: 1;
            height: 100%;
        }
        .table-card h3 { font-size: 1.05rem; color: #1565C0; margin-top: 0; display: flex; align-items: center; justify-content: space-between; }
        .table-count-badge { background: #E1F5FE; color: #0277BD; padding: 3px 10px; border-radius: 20px; font-size: 0.8rem; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 4px; }
        th { background: #E3F2FD; padding: 8px 10px; text-align: left; cursor: pointer; border-bottom: 2px solid #ddd; position: relative; user-select: none; }
        th:hover { background: #BBDEFB; }
        th.sort-asc::after { content: " ▲"; color: var(--accent-blue); }
        th.sort-desc::after { content: " ▼"; color: var(--accent-blue); }
        td { padding: 8px 10px; border-bottom: 1px solid #eee; }
        .prod-link { color: #2196F3; text-decoration: underline; font-weight: bold; cursor: pointer; }
        
        .shipping-item { margin-bottom: 6px; font-size: 0.76rem; font-weight: 700; }
        .progress-bg { background: #D1D9E6; height: 7px; border-radius: 50px; overflow: hidden; margin-top: 2px; }
        .progress-bar { height: 100%; background: var(--accent-blue); transition: width 0.8s; }
        
        #recent-sales-list {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }
        .recent-sales-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 2px 4px;
            border-bottom: 1px solid #ECEFF1;
            font-size: 0.76rem;
            gap: 8px;
        }
        .recent-sales-item:last-child { border-bottom: none; }
        .recent-date {
            color: #78909C;
            font-size: 0.74rem;
            font-weight: 700;
            min-width: 76px;
            white-space: nowrap;
        }
        .recent-link {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .recent-price {
            font-weight: 800;
            color: #2E7D32;
            min-width: 65px;
            text-align: right;
            white-space: nowrap;
        }
        
        input[type="file"] { display: none; }
        .file-status { font-size: 0.72rem; color: #555; text-align: center; margin-bottom: 3px; }
        hr { width:100%; border:0; border-top:1px dashed #999; margin:6px 0; }    
    </style>
</head>
<body>
    <nav>        
        <div class="logo" onclick="showPage('dashboardPage')">Dashboard</div>        
        <button class="menu-btn" onclick="showPage('allStockPage')">
            <span>全在庫一覧</span>
            <span id="menu-stock-count" style="font-size:0.75rem; background:rgba(255,255,255,0.25); padding:1px 6px; border-radius:8px;">0</span>
        </button>        
        <button class="menu-btn" onclick="showPage('salesListPage')">
            <span>販売品一覧</span>
            <span id="menu-sales-count" style="font-size:0.75rem; background:rgba(255,255,255,0.25); padding:1px 6px; border-radius:8px;">0</span>
        </button>        
        <button class="menu-btn" onclick="showPage('resalePage')">
            <span>再出品予定</span>
            <span id="menu-resale-count" style="font-size:0.75rem; background:rgba(255,255,255,0.25); padding:1px 6px; border-radius:8px;">0</span>
        </button>        
        <hr>        
        <label for="listingCsv" class="upload-label">📁 在庫一覧 CSV 選択</label>
        <input type="file" id="listingCsv" accept=".csv">
        <div id="listing-status" class="file-status">保存データを表示中</div>
        
        <label for="salesCsv" class="upload-label">💰 販売履歴 CSV 選択</label>
        <input type="file" id="salesCsv" accept=".csv">
        <div id="sales-status" class="file-status">保存データを表示中</div>
        
        <button id="applyBtn" class="menu-btn run-btn">データを反映する</button>
        
        <hr>
        <div style="font-size: 0.72rem; color: #444; text-align: center; font-weight: 700; margin-bottom: 2px;">データバックアップ</div>
        <button class="menu-btn" style="background:#78909C; justify-content:center;" onclick="exportData()">💾 JSONエクスポート</button>
        <label for="importJson" class="upload-label" style="background:#ECEFF1; color:#37474F;">📂 JSONインポート</label>
        <input type="file" id="importJson" accept=".json">
    </nav>

    <main>        
        <header>            
            <div class="header-widget mercari-logo">メルカリ</div>            
            <div class="header-widget stat-stock">現在庫数（ <span id="count-stock">-</span> ）個</div>            
            <div class="header-widget stat-sales">今月販売数（ <span id="count-sales-month">-</span> ）個</div>            
            <div class="clock-card" id="current-time"></div>
            <button class="copy-source-btn" onclick="copyCurrentSource()">📋 HTML全体コピー</button>
        </header>
        
        <div id="dashboardPage" class="page-content active-page">
            <div class="manual-input-box">
                <label for="manualStockCode">🏷️ 管理番号（4桁）販売処理:</label>
                <input type="text" id="manualStockCode" placeholder="例: 1249" maxlength="10">
                <button class="manual-btn" onclick="processManualSold()">販売完了処理</button>
                <div class="manual-hint">※ 番号を入力すると「全在庫一覧」から除外され、「販売品一覧」へ即時反映されます。</div>
            </div>

            <div class="dashboard-grid">                
                <div class="card col-inv">                    
                    <h3>出品月別_在庫数 (実データ集計)</h3>                    
                    <div class="chart-container"><canvas id="inventoryChart"></canvas></div>                
                </div>                
                <div class="card col-type">                    
                    <h3>種類別構成</h3>                    
                    <div class="chart-container"><canvas id="typeChart"></canvas></div>                
                </div>                
                <div class="card col-ship">                    
                    <h3>配送方法</h3>                    
                    <div id="shipping-list" style="flex:1; overflow-y:auto;"></div>                
                </div>                
                <div class="card col-sales">                    
                    <h3>月別販売推移</h3>                    
                    <div class="sales-chart-container"><canvas id="salesChart"></canvas></div>
                    <div class="monthly-summary-wrapper">
                        <div class="monthly-summary-title">📄 月別 売上・費用・利益（ドラッグしてコピー可能）</div>
                        <div class="monthly-summary-container" id="salesSummaryList"></div>
                    </div>
                </div>                
                <div class="card col-recent-sales">                    
                    <h3>最近の販売履歴 (直近9件)</h3>                    
                    <div id="recent-sales-list"></div>                
                </div>            
            </div>        
        </div>
        
        <div id="allStockPage" class="page-content">
            <div class="table-card">
                <h3>
                    <span>全在庫一覧</span>
                    <span class="table-count-badge" id="badge-stock-count">全 0 件</span>
                </h3>
                <div id="allStockTable"></div>
            </div>
        </div>        
        <div id="salesListPage" class="page-content">
            <div class="table-card">
                <h3>
                    <span>販売品一覧</span>
                    <span class="table-count-badge" id="badge-sales-count">全 0 件</span>
                </h3>
                <div id="salesListTable"></div>
            </div>
        </div>        
        <div id="resalePage" class="page-content">
            <div class="table-card">
                <h3>
                    <span>再出品予定リスト</span>
                    <span class="table-count-badge" id="badge-resale-count">全 0 件</span>
                </h3>
                <div id="resaleTable"></div>
            </div>
        </div>    
    </main>

    <script>        
        let rawListing = JSON.parse(localStorage.getItem('mercari_last_listing')) || [];        
        let rawSales = JSON.parse(localStorage.getItem('mercari_last_sales')) || [];        
        let charts = {};        
        let sortState = { allStock: { key: '出品日時', dir: 'desc' }, salesList: { key: '購入完了日', dir: 'desc' }, resale: { key: 'elapsed', dir: 'desc' } };

        window.onload = () => {            
            updateTime();            
            removeSoldFromListing();
            updateAllUI();

            document.getElementById('manualStockCode').addEventListener('keyup', function(e) {
                if (e.key === 'Enter') processManualSold();
            });
        };        
        setInterval(updateTime, 1000);

        function updateTime() {            
            const now = new Date();            
            const days = ['日', '月', '火', '水', '木', '金', '土'];            
            document.getElementById('current-time').innerText = `${now.getFullYear()}年 ${(now.getMonth()+1).toString().padStart(2,'0')}月 ${now.getDate().toString().padStart(2,'0')}日 (${days[now.getDay()]}) ${now.toLocaleTimeString('ja-JP', {hour12:false})}`;        
        }

        function copyCurrentSource() {
            const htmlSource = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            navigator.clipboard.writeText(htmlSource).then(() => {
                alert("HTMLコード全体がクリップボードにコピーされました！");
            }).catch(() => {
                const ta = document.createElement("textarea");
                ta.value = htmlSource;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand("copy");
                document.body.removeChild(ta);
                alert("HTMLコード全体がクリップボードにコピーされました！");
            });
        }

        function showPage(pageId) {            
            document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active-page'));            
            document.getElementById(pageId).classList.add('active-page');            
            window.scrollTo(0,0);        
        }

        document.getElementById('listingCsv').onchange = e => { if(e.target.files[0]) document.getElementById('listing-status').innerText = "✅ " + e.target.files[0].name; };        
        document.getElementById('salesCsv').onchange = e => { if(e.target.files[0]) document.getElementById('sales-status').innerText = "✅ " + e.target.files[0].name; };

        function extract4DigitCode(str) {
            if (!str) return null;
            const match = str.match(/\b(\d{4})\b/) || str.match(/[\s _-](\d{4})[\s _-]/) || str.match(/(\d{4})/);
            return match ? match[1] : null;
        }

        function removeSoldFromListing() {
            if (!rawSales.length || !rawListing.length) return 0;
            
            const soldIds = new Set();
            const soldUrls = new Set();
            const soldCodes = new Set();

            rawSales.forEach(s => {
                if (s['商品ID']) soldIds.add(String(s['商品ID']).trim());
                if (s['商品URL']) soldUrls.add(String(s['商品URL']).trim());
                const code = extract4DigitCode(s['商品名']);
                if (code) soldCodes.add(code);
            });

            const initialCount = rawListing.length;
            rawListing = rawListing.filter(item => {
                const id = String(item['商品ID'] || '').trim();
                const url = String(item['商品URL'] || '').trim();
                const code = extract4DigitCode(item['商品名']);

                if (id && soldIds.has(id)) return false;
                if (url && soldUrls.has(url)) return false;
                if (code && soldCodes.has(code)) return false;
                return true;
            });

            const removedCount = initialCount - rawListing.length;
            if (removedCount > 0) {
                localStorage.setItem('mercari_last_listing', JSON.stringify(rawListing));
            }
            return removedCount;
        }

        function processManualSold() {
            const inputEl = document.getElementById('manualStockCode');
            const code = (inputEl.value || '').trim();

            if (!code) {
                alert("管理番号（4桁）を入力してください。");
                inputEl.focus();
                return;
            }

            const foundIndex = rawListing.findIndex(item => {
                const itemCode = extract4DigitCode(item['商品名']);
                return itemCode === code || (item['商品名'] && item['商品名'].includes(code));
            });

            if (foundIndex === -1) {
                alert(`管理番号 [ ${code} ] に該当する商品を「全在庫一覧」で見つけることができませんでした。`);
                return;
            }

            const matchedItem = rawListing.splice(foundIndex, 1)[0];

            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            const nowStr = `${y}-${m}-${d} ${hh}:${mm}:${ss}`;

            const price = parseInt(String(matchedItem['商品代金'] || "0").replace(/[^0-9]/g, "")) || 0;
            const fee = Math.floor(price * 0.1);
            const profit = price - fee;

            const newSoldItem = {
                '購入完了日': nowStr,
                '商品ID': matchedItem['商品ID'] || ('manual_' + Date.now()),
                '商品名': matchedItem['商品名'] || `手動販売商品 (${code})`,
                '商品URL': matchedItem['商品URL'] || '#',
                '商品代金': price.toString(),
                '販売利益': profit.toString(),
                '配送の方法': matchedItem['配送の方法'] || 'ゆうゆうメルカリ便'
            };

            rawSales.unshift(newSoldItem);

            localStorage.setItem('mercari_last_listing', JSON.stringify(rawListing));
            localStorage.setItem('mercari_last_sales', JSON.stringify(rawSales));

            updateAllUI();

            alert(`✅ 管理番号 [ ${code} ] の販売処理が完了しました！\n\n・商品名: ${matchedItem['商品名']}\n・価格: ¥${price.toLocaleString()}\n「全在庫一覧」から除外され、「販売品一覧」に反映されました。`);
            inputEl.value = '';
        }

        document.getElementById('applyBtn').onclick = function() {            
            const lFile = document.getElementById('listingCsv').files[0];            
            const sFile = document.getElementById('salesCsv').files[0];            
            const options = { header: true, skipEmptyLines: true, transformHeader: h => h.trim().replace(/^\ufeff/, "") };            
            let loaded = 0, target = (lFile?1:0) + (sFile?1:0);

            if (target === 0) {
                if (rawListing.length > 0 || rawSales.length > 0) {
                    const removed = removeSoldFromListing();
                    updateAllUI();
                    alert(`保存されている既存データを反映しました。${removed > 0 ? `\n(販売済み在庫 ${removed}件を除外)` : ''}`);
                } else {
                    alert("反映するファイルが選択されておらず、保存データもありません。");
                }
                return;
            }

            if (lFile) {
                Papa.parse(lFile, { 
                    ...options, 
                    complete: r => { 
                        rawListing = r.data; 
                        localStorage.setItem('mercari_last_listing', JSON.stringify(rawListing)); 
                        check(); 
                    }
                });
            }            
            if (sFile) {
                Papa.parse(sFile, { 
                    ...options, 
                    complete: r => { 
                        rawSales = r.data; 
                        localStorage.setItem('mercari_last_sales', JSON.stringify(rawSales)); 
                        check(); 
                    }
                });
            }            
            
            function check() { 
                loaded++; 
                if(loaded === target) { 
                    const removed = removeSoldFromListing();
                    updateAllUI(); 
                    alert(`新しいデータを反映しました。${removed > 0 ? `\n(販売済みの在庫 ${removed}件が「全在庫一覧」から自動除外されました)` : ''}`); 
                } 
            }        
        };

        function exportData() {
            const data = { listing: rawListing, sales: rawSales };
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "mercari_backup_" + new Date().toISOString().slice(0,10) + ".json";
            a.click();
        }

        document.getElementById('importJson').onchange = e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const imported = JSON.parse(event.target.result);
                    if(imported.listing) rawListing = imported.listing;
                    if(imported.sales) rawSales = imported.sales;
                    removeSoldFromListing();
                    localStorage.setItem('mercari_last_listing', JSON.stringify(rawListing));
                    localStorage.setItem('mercari_last_sales', JSON.stringify(rawSales));
                    updateAllUI();
                    alert("バックアップデータが正常にインポートされ、反映されました。");
                } catch(err) {
                    alert("JSONファイルの読み込みに失敗しました。");
                }
            };
            reader.readAsText(file);
        };

        function updateAllUI() {            
            const stockCount = rawListing.length;
            const salesCount = rawSales.length;

            const curM = (new Date().getMonth()+1).toString().padStart(2,'0');            
            const curY = new Date().getFullYear();            
            const salesM = rawSales.filter(d => (d['購入完了日']||"").includes(`${curY}-${curM}`)).length;            

            document.getElementById('count-stock').innerText = stockCount.toLocaleString();            
            document.getElementById('count-sales-month').innerText = salesM.toLocaleString();

            document.getElementById('menu-stock-count').innerText = `${stockCount}件`;
            document.getElementById('menu-sales-count').innerText = `${salesCount}件`;

            document.getElementById('badge-stock-count').innerText = `全 ${stockCount.toLocaleString()} 件`;
            document.getElementById('badge-sales-count').innerText = `全 ${salesCount.toLocaleString()} 件`;

            renderCharts();            
            rebuildTables();        
        }

        function categorize(name) {            
            if (!name) return 'その他';            
            const n = name.toLowerCase();            
            if (n.includes('水着')) return '水着';            
            if (n.includes('ハイヒール') || n.includes('パンプス')) return '靴';            
            if (n.includes('ボディコン')) return 'ボディコン';            
            if (n.includes('ワンピース') || n.includes('ワンピ')) return 'ワンピース';            
            if (n.includes('スカート')) return 'スカート';            
            if (n.includes('パンツ')) return 'パンツ';            
            if (n.includes('インナー') || n.includes('ショーツ') || n.includes('ボディスーツ')) return 'インナー';            
            return 'その他';        
        }

        function renderCharts() {            
            const invMap = {};            
            rawListing.forEach(d => {                
                const dateStr = d['出品日時'] || ""; 
                if (dateStr.includes('-')) {                    
                    const parts = dateStr.split('-');                    
                    const label = `${parts[0].slice(-2)}-${parts[1]}`;                    
                    invMap[label] = (invMap[label] || 0) + 1;                
                }            
            });            
            const invLabels = Object.keys(invMap).sort();            
            drawBar('inventoryChart', invLabels, invLabels.map(l => invMap[l]), '#2196F3');

            const types = {};            
            rawListing.forEach(d => { const cat = categorize(d['商品名']); types[cat] = (types[cat] || 0) + 1; });            
            drawPie('typeChart', Object.keys(types), Object.values(types));

            const ships = {};            
            rawSales.forEach(d => { const m = d['配送の方法']||"未定"; ships[m] = (ships[m]||0)+1; });            
            document.getElementById('shipping-list').innerHTML = Object.keys(ships).map(m => {                
                const pct = Math.round((ships[m]/(rawSales.length||1))*100);                
                return `<div class="shipping-item">${m} (${pct}%)<div class="progress-bg"><div class="progress-bar" style="width:${pct}%"></div></div></div>`;            
            }).join('');

            const saleProfits = {}, saleCounts = {}, saleRevenues = {}, saleCosts = {};            
            rawSales.forEach(d => {                
                const ds = d['購入完了日'] || "";                
                if (ds.includes('-')) {                    
                    const parts = ds.split('-');                    
                    const label = `${parts[0].slice(-2)}-${parts[1]}`;                    
                    const p = parseInt((d['販売利益']||"0").replace(/[^0-9]/g,""))||0;                    
                    const r = parseInt((d['商品代金']||"0").replace(/[^0-9]/g,""))||0;
                    const c = Math.max(0, r - p);
                    
                    saleProfits[label] = (saleProfits[label] || 0) + p;                    
                    saleCounts[label] = (saleCounts[label] || 0) + 1;
                    saleRevenues[label] = (saleRevenues[label] || 0) + r;
                    saleCosts[label] = (saleCosts[label] || 0) + c;
                }            
            });            
            const saleLabels = Object.keys(saleProfits).sort();            
            drawSalesChart('salesChart', saleLabels, saleLabels.map(l => saleProfits[l]), saleLabels.map(l => saleCounts[l]));

            const summaryHtml = saleLabels.map(label => `
                <div class="monthly-data-badge">
                    <div class="badge-month">${label}</div>
                    <div class="badge-rev">売上: ¥${(saleRevenues[label]||0).toLocaleString()}</div>
                    <div class="badge-cost">費用: ¥${(saleCosts[label]||0).toLocaleString()}</div>
                    <div class="badge-profit">利益: ¥${(saleProfits[label]||0).toLocaleString()}</div>
                </div>
            `).join('');
            document.getElementById('salesSummaryList').innerHTML = summaryHtml || '<div style="color:#999; font-size:0.85rem;">データがありません</div>';

            const recentSales = [...rawSales].sort((a, b) => {
                const dateA = a['購入完了日'] || '';
                const dateB = b['購入完了日'] || '';
                return dateB.localeCompare(dateA);
            }).slice(0, 9);

            if (recentSales.length > 0) {
                document.getElementById('recent-sales-list').innerHTML = recentSales.map(item => {
                    const fullDate = item['購入完了日'] || '-';
                    const shortDate = fullDate.length >= 10 ? fullDate.substring(0, 10) : fullDate;
                    const name = item['商品名'] || '商品名なし';
                    const shortName = name.length > 30 ? (name.substring(0, 30) + '..') : name;
                    const price = parseInt(String(item['商品代金'] || "0").replace(/[^0-9]/g, "")) || 0;
                    const url = item['商品URL'] || '#';

                    return `
                        <div class="recent-sales-item">
                            <span class="recent-date">${shortDate}</span>
                            <span class="recent-link"><a href="${url}" target="_blank" class="prod-link" title="${name}">${shortName}</a></span>
                            <span class="recent-price">¥${price.toLocaleString()}</span>
                        </div>
                    `;
                }).join('');
            } else {
                document.getElementById('recent-sales-list').innerHTML = '<div style="color:#999; font-size:0.8rem; padding: 10px 0;">販売履歴データがありません</div>';
            }
        }

        function sortTableData(data, key, direction) {            
            return [...data].sort((a, b) => {                
                let vA = a[key] || '', vB = b[key] || '';                
                if (['商品代金', '販売利益', 'いいね！', 'elapsed'].includes(key)) {                    
                    vA = parseInt(String(vA).replace(/[^0-9]/g, "")) || 0;                    
                    vB = parseInt(String(vB).replace(/[^0-9]/g, "")) || 0;                
                }                
                if (vA < vB) return direction === 'asc' ? -1 : 1;                
                if (vA > vB) return direction === 'asc' ? 1 : -1;                
                return 0;            
            });        
        }

        function triggerSort(tableId, key) {            
            const cur = sortState[tableId];            
            if (cur.key === key) cur.dir = cur.dir === 'asc' ? 'desc' : 'asc';            
            else { cur.key = key; cur.dir = 'asc'; }            
            rebuildTables();        
        }

        function getCls(tableId, key) {            
            if (sortState[tableId].key !== key) return "";            
            return sortState[tableId].dir === 'asc' ? "sort-asc" : "sort-desc";        
        }

        function rebuildTables() {            
            let dataA = sortTableData(rawListing, sortState.allStock.key, sortState.allStock.dir);            
            let hA = `<table><thead><tr><th class="${getCls('allStock','出品日時')}" onclick="triggerSort('allStock','出品日時')">出品日時</th><th>種類</th><th onclick="triggerSort('allStock','商品名')">商品名</th><th class="${getCls('allStock','商品代金')}" onclick="triggerSort('allStock','商品代金')">価格</th><th class="${getCls('allStock','いいね！')}" onclick="triggerSort('allStock','いいね！')">いいね</th></tr></thead><tbody>`;            
            dataA.forEach(d => hA += `<tr><td>${d['出品日時']||'-'}</td><td>${categorize(d['商品名'])}</td><td><a href="${d['商品URL']||'#'}" target="_blank" class="prod-link">${d['商品名']}</a></td><td>¥${(parseInt(d['商品代金'])||0).toLocaleString()}</td><td>${d['いいね！']||0}</td></tr>`);            
            document.getElementById('allStockTable').innerHTML = hA + `</tbody></table>`;

            let dataS = sortTableData(rawSales, sortState.salesList.key, sortState.salesList.dir);            
            let hS = `<table><thead><tr><th class="${getCls('salesList','購入完了日')}" onclick="triggerSort('salesList','購入完了日')">完了日</th><th onclick="triggerSort('salesList','商品名')">商品名</th><th class="${getCls('salesList','商品代金')}" onclick="triggerSort('salesList','商品代金')">価格</th><th class="${getCls('salesList','販売利益')}" onclick="triggerSort('salesList','販売利益')">利益</th></tr></thead><tbody>`;            
            dataS.forEach(d => hS += `<tr><td>${d['購入完了日']||'-'}</td><td><a href="${d['商品URL']||'#'}" target="_blank" class="prod-link">${d['商品名']}</a></td><td>¥${(parseInt(d['商品代金'])||0).toLocaleString()}</td><td>¥${(parseInt(d['販売利益'])||0).toLocaleString()}</td></tr>`);            
            document.getElementById('salesListTable').innerHTML = hS + `</tbody></table>`;

            const today = new Date();            
            let dataR = rawListing.filter(d => {
                if(!d['出品日時']) return false;
                const diff = Math.ceil(Math.abs(today - new Date(d['出品日時']))/(1000*60*60*24));
                return diff >= 30;
            }).map(d => ({
                ...d, 
                elapsed: Math.ceil(Math.abs(today - new Date(d['出品日時']))/(1000*60*60*24))
            }));            

            document.getElementById('menu-resale-count').innerText = `${dataR.length}件`;
            document.getElementById('badge-resale-count').innerText = `全 ${dataR.length.toLocaleString()} 件`;

            dataR = sortTableData(dataR, sortState.resale.key, sortState.resale.dir);            
            let hR = `<table><thead><tr><th class="${getCls('resale','出品日時')}" onclick="triggerSort('resale','出品日時')">出品日時</th><th class="${getCls('resale','elapsed')}" onclick="triggerSort('resale','elapsed')">経過日数</th><th onclick="triggerSort('resale','商品名')">商品名</th><th class="${getCls('resale','商品代金')}" onclick="triggerSort('resale','商品代金')">価格</th></tr></thead><tbody>`;            
            dataR.forEach(d => hR += `<tr><td>${d['出品日時']||'-'}</td><td style="color:red; font-weight:bold;">${d.elapsed}日</td><td><a href="${d['商品URL']||'#'}" target="_blank" class="prod-link">${d['商品名']}</a></td><td>¥${(parseInt(d['商品代金'])||0).toLocaleString()}</td></tr>`);            
            document.getElementById('resaleTable').innerHTML = hR + `</tbody></table>`;        
        }

        function drawBar(id, labels, values, color) {            
            if(charts[id]) charts[id].destroy();            
            charts[id] = new Chart(document.getElementById(id), {                
                type: 'bar', data: { labels, datasets: [{ data: values, backgroundColor: color, borderRadius: 5 }] },                
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }            
            });        
        }

        function drawSalesChart(id, labels, profits, counts) {            
            if(charts[id]) charts[id].destroy();

            charts[id] = new Chart(document.getElementById(id), {                
                type: 'bar', 
                data: { 
                    labels, 
                    datasets: [
                        { label: '利益', data: profits, backgroundColor: '#66BB6A', yAxisID: 'y', borderRadius: 4 }, 
                        { label: '件数', data: counts, type: 'line', borderColor: '#FF7043', borderWidth: 2, pointRadius: 2.5, yAxisID: 'y1' }
                    ] 
                },                
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    layout: {
                        padding: { top: 0, bottom: 0, left: 0, right: 0 }
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            align: 'center',
                            labels: {
                                boxWidth: 10,
                                boxHeight: 7,
                                font: { size: 9, weight: 'bold' },
                                padding: 2
                            }
                        }
                    },
                    scales: { 
                        x: { 
                            ticks: { font: { weight: 'bold', size: 9 }, padding: 0 },
                            grid: { display: false }
                        },
                        y: { 
                            position: 'left',
                            ticks: { font: { size: 8 }, padding: 2 }
                        }, 
                        y1: { 
                            position: 'right', 
                            grid: { display: false },
                            ticks: { font: { size: 8 }, padding: 2 }
                        } 
                    } 
                }
            });        
        }

        function drawPie(id, labels, values) {            
            if(charts[id]) charts[id].destroy();            
            charts[id] = new Chart(document.getElementById(id), {                
                type: 'doughnut', data: { labels, datasets: [{ data: values, backgroundColor: ['#2196F3', '#FF9800', '#66BB6A', '#F06292', '#FFEB3B', '#9C27B0'] }] },                
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } }, cutout: '55%' }            
            });        
        }
    </script>
</body>
</html>
