<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メルカリ販売管理ダッシュボード</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #B3E5FC;
            --card-bg: #F5F5F5;
            --accent-blue: #2196F3;
            --accent-orange: #FF7043;
            --mercari-red: #FF0000;
            --clay-shadow: 20px 20px 40px rgba(0,0,0,0.1), inset -10px -10px 15px rgba(0,0,0,0.05), inset 10px 10px 15px rgba(255,255,255,0.8);
            --btn-shadow: 8px 8px 16px rgba(0,0,0,0.1), inset -4px -4px 8px rgba(0,0,0,0.1), inset 4px 4px 8px rgba(255,255,255,0.5);
        }

        body { background-color: var(--bg-color); font-family: 'Noto Sans JP', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; color: #333; }
        
        /* Sidebar */
        nav { width: 260px; padding: 25px; display: flex; flex-direction: column; gap: 12px; z-index: 100; }
        .logo { font-size: 2.2rem; font-weight: 900; margin-bottom: 15px; color: #1A237E; cursor: pointer; }
        
        .menu-btn {
            background: var(--accent-blue); color: white; padding: 12px; border-radius: 20px;
            text-align: center; border: none; box-shadow: var(--btn-shadow); cursor: pointer; font-weight: 700; transition: 0.2s;
            font-size: 0.95rem;
        }
        .menu-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .upload-label { background: white; color: var(--accent-blue); font-size: 0.85rem; border: 2px solid #BBDEFB; margin-top: 5px; }
        .run-btn { background: var(--accent-orange) !important; margin-top: 10px; font-size: 1rem; padding: 15px !important; }

        /* Main Area */
        main { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; }
        
        /* Header Widgets */
        header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .header-widget {
            padding: 10px 25px; border-radius: 15px; font-weight: 900; font-size: 1.2rem;
            box-shadow: var(--clay-shadow); border: 3px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center;
        }
        .mercari-logo { background: var(--mercari-red); color: white; border-radius: 12px; width: 180px; font-size: 1.5rem; letter-spacing: 5px; }
        .stat-stock { background: #000; color: white; min-width: 150px; }
        .stat-sales { background: #448AFF; color: white; min-width: 150px; }
        .clock-card { background: #64B5F6; color: white; margin-left: auto; border-radius: 50px; font-size: 1rem; padding: 10px 20px; }

        /* Page Content */
        .page-content { display: none; width: 100%; animation: fadeIn 0.4s; }
        .active-page { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Dashboard Grid */
        .dashboard-grid { display: grid; grid-template-columns: 1.8fr 1fr 1fr; grid-template-rows: auto auto; gap: 20px; }
        .card { background: var(--card-bg); border-radius: 30px; padding: 15px; box-shadow: var(--clay-shadow); border: 5px solid white; display: flex; flex-direction: column; }
        .card h3 { margin: 0 0 10px 0; color: #555; font-size: 0.9rem; font-weight: 900; }
        .chart-container { flex: 1; position: relative; min-height: 250px; }

        /* Tables */
        .table-card { background: white; border-radius: 30px; padding: 25px; box-shadow: var(--clay-shadow); border: 5px solid white; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { background: #E3F2FD; padding: 12px; text-align: left; cursor: pointer; position: relative; user-select: none; }
        th:hover { background: #BBDEFB; }
        th::after { content: " ↕"; font-size: 0.7rem; color: #999; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        .prod-link { color: #2196F3; text-decoration: underline; font-weight: bold; cursor: pointer; }

        /* Widgets Items */
        .shipping-item { margin-bottom: 10px; font-size: 0.8rem; font-weight: 700; }
        .progress-bg { background: #D1D9E6; height: 10px; border-radius: 50px; overflow: hidden; margin-top: 3px; }
        .progress-bar { height: 100%; background: var(--accent-blue); transition: width 1s; }
        .top-product { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #eee; font-size: 0.8rem; font-weight: 700; }

        input[type="file"] { display: none; }
        .file-status { font-size: 0.7rem; color: #555; text-align: center; margin-bottom: 5px; }
        hr { width:100%; border:0; border-top:1px dashed #999; margin:10px 0; }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="showPage('dashboardPage')">Dashboard</div>
        <button class="menu-btn" onclick="showPage('allStockPage')">全在庫一覧</button>
        <button class="menu-btn" onclick="showPage('monthlyStockPage')">出品月別在庫</button>
        <button class="menu-btn" onclick="showPage('salesListPage')">販売品一覧</button>
        <button class="menu-btn" onclick="showPage('resalePage')">再出品予定</button>
        <hr>
        <label for="listingCsv" class="menu-btn upload-label">📁 Listing CSV 選択</label>
        <input type="file" id="listingCsv" accept=".csv">
        <div id="listing-status" class="file-status">ファイル未選択</div>
        <label for="salesCsv" class="menu-btn upload-label">💰 Sales CSV 選択</label>
        <input type="file" id="salesCsv" accept=".csv">
        <div id="sales-status" class="file-status">ファイル未選択</div>
        <button id="applyBtn" class="menu-btn run-btn">データを反映する</button>
    </nav>

    <main>
        <header>
            <div class="header-widget mercari-logo">メルカリ</div>
            <div class="header-widget stat-stock">現在庫数（ <span id="count-stock">-</span> ）個</div>
            <div class="header-widget stat-sales">今月販売数（ <span id="count-sales-month">-</span> ）個</div>
            <div class="clock-card" id="current-time"></div>
        </header>

        <div id="dashboardPage" class="page-content active-page">
            <div class="dashboard-grid">
                <div class="card">
                    <h3>出品月別_在庫数</h3>
                    <div class="chart-container"><canvas id="inventoryChart"></canvas></div>
                </div>
                <div class="card">
                    <h3>種類別構成</h3>
                    <div class="chart-container"><canvas id="typeChart"></canvas></div>
                </div>
                <div class="card">
                    <h3>配送方法</h3>
                    <div id="shipping-list"></div>
                </div>
                <div class="card" style="grid-column: span 2;">
                    <h3>月別販売利益</h3>
                    <div class="chart-container"><canvas id="salesChart"></canvas></div>
                </div>
                <div class="card">
                    <h3>いいね！数上位</h3>
                    <div id="likes-list"></div>
                </div>
            </div>
        </div>

        <!-- 各ページ一覧 -->
        <div id="allStockPage" class="page-content"><div class="table-card"><h3>全在庫一覧 (ヘッダークリックでソート)</h3><div id="allStockTable"></div></div></div>
        <div id="monthlyStockPage" class="page-content"><div class="table-card"><h3>出品月別在庫リスト (ヘッダークリックでソート)</h3><div id="monthlyStockTable"></div></div></div>
        <div id="salesListPage" class="page-content"><div class="table-card"><h3>販売品一覧 (ヘッダークリックでソート)</h3><div id="salesListTable"></div></div></div>
        <div id="resalePage" class="page-content"><div class="table-card"><h3>再出品予定リスト (30日経過 / ヘッダークリックでソート)</h3><div id="resaleTable"></div></div></div>
    </main>

    <script>
        // グローバル変数
        let rawListing = [], rawSales = [];
        let charts = {};
        let sortConfig = { table: '', key: '', direction: 'asc' };

        // 時計更新
        function updateTime() {
            const now = new Date();
            const days = ['日', '月', '火', '水', '木', '金', '土'];
            document.getElementById('current-time').innerText = `${now.getFullYear()}年 ${(now.getMonth()+1).toString().padStart(2,'0')}月 ${now.getDate().toString().padStart(2,'0')}日 (${days[now.getDay()]}) ${now.toLocaleTimeString('ja-JP', {hour12:false})}`;
        }
        setInterval(updateTime, 1000); updateTime();

        // ページ切替
        function showPage(pageId) {
            document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active-page'));
            document.getElementById(pageId).classList.add('active-page');
        }

        // CSVパース
        document.getElementById('listingCsv').onchange = e => {
            if(e.target.files[0]) {
                document.getElementById('listing-status').innerText = "✅ " + e.target.files[0].name;
                Papa.parse(e.target.files[0], { header: true, skipEmptyLines: true, complete: r => {
                    rawListing = r.data.map(row => {
                        let n = {}; Object.keys(row).forEach(k => n[k.trim().replace(/^\ufeff/, "")] = row[k]); return n;
                    });
                }});
            }
        };
        document.getElementById('salesCsv').onchange = e => {
            if(e.target.files[0]) {
                document.getElementById('sales-status').innerText = "✅ " + e.target.files[0].name;
                Papa.parse(e.target.files[0], { header: true, skipEmptyLines: true, complete: r => {
                    rawSales = r.data.map(row => {
                        let n = {}; Object.keys(row).forEach(k => n[k.trim().replace(/^\ufeff/, "")] = row[k]); return n;
                    });
                }});
            }
        };

        // カテゴリー判別
        function categorize(name) {
            if (!name) return 'その他';
            if (name.includes('水着') || name.includes('ビキニ')) return '水着';
            if (name.includes('ハイヒール') || name.includes('パンプス') || name.includes('サンダル') || name.includes('ブーツ')) return '靴';
            if (name.includes('ボディコン')) return 'ボディコン';
            if (name.includes('ワンピース') || name.includes('ワンピ')) return 'ワンピース';
            if (name.includes('スカート')) return 'スカート';
            if (name.includes('パンツ') || name.includes('レギンス')) return 'パンツ';
            if (name.includes('Tシャツ') || name.includes('シャツ') || name.includes('セーター')) return 'トップス';
            if (name.includes('ボディスーツ') || name.includes('ランジェリー') || name.includes('ショーツ')) return 'インナー';
            return 'その他';
        }

        // データを反映
        document.getElementById('applyBtn').onclick = () => {
            if(rawListing.length === 0 || rawSales.length === 0) return alert("CSVファイルを両方選択してください。");
            
            document.getElementById('count-stock').innerText = rawListing.length;
            const currentMonth = (new Date().getMonth() + 1).toString().padStart(2, '0');
            const thisMonthCount = rawSales.filter(d => (d['購入完了日']||"").includes(`-${currentMonth}-`)).length;
            document.getElementById('count-sales-month').innerText = thisMonthCount;

            renderCharts(rawListing, rawSales);
            rebuildAllTables();
            alert("データを反映しました。");
        };

        // ソート処理
        function sortData(data, key, direction) {
            return data.sort((a, b) => {
                let valA = a[key] || '';
                let valB = b[key] || '';

                // 数値変換（価格やいいね数）
                if (key.includes('価格') || key.includes('代金') || key.includes('利益') || key.includes('いいね')) {
                    valA = parseInt(String(valA).replace(/[^0-9]/g, "")) || 0;
                    valB = parseInt(String(valB).replace(/[^0-9]/g, "")) || 0;
                }

                if (valA < valB) return direction === 'asc' ? -1 : 1;
                if (valA > valB) return direction === 'asc' ? 1 : -1;
                return 0;
            });
        }

        function handleSort(tableName, key) {
            if (sortConfig.key === key) {
                sortConfig.direction = sortConfig.direction === 'asc' ? 'desc' : 'asc';
            } else {
                sortConfig.key = key;
                sortConfig.direction = 'asc';
            }
            sortConfig.table = tableName;
            rebuildAllTables();
        }

        function rebuildAllTables() {
            buildAllStockTable();
            buildMonthlyStockTable();
            buildSalesTable();
            buildResaleTable();
        }

        // テーブル構築（ソート機能付き）
        function buildAllStockTable() {
            let data = [...rawListing];
            if(sortConfig.table === 'all') data = sortData(data, sortConfig.key, sortConfig.direction);
            
            let html = `<table><thead><tr>
                <th onclick="handleSort('all','出品日時')">出品日</th>
                <th>種類</th>
                <th onclick="handleSort('all','商品名')">商品名</th>
                <th onclick="handleSort('all','商品代金')">価格</th>
                <th onclick="handleSort('all','いいね！')">いいね</th>
            </tr></thead><tbody>`;
            data.forEach(d => html += `<tr><td>${d['出品日時']}</td><td>${categorize(d['商品名'])}</td><td><a href="${d['商品URL']}" target="_blank" class="prod-link">${d['商品名']}</a></td><td>¥${parseInt(d['商品代金']||0).toLocaleString()}</td><td>${d['いいね！']}</td></tr>`);
            document.getElementById('allStockTable').innerHTML = html + `</tbody></table>`;
        }

        function buildMonthlyStockTable() {
            let data = [...rawListing];
            if(sortConfig.table === 'monthly') data = sortData(data, sortConfig.key, sortConfig.direction);
            else data.sort((a,b) => (a['出品月(集計用)']||'').localeCompare(b['出品月(集計用)']||''));

            let html = `<table><thead><tr>
                <th onclick="handleSort('monthly','出品月(集計用)')">出品月</th>
                <th>種類</th>
                <th onclick="handleSort('monthly','商品名')">商品名</th>
                <th onclick="handleSort('monthly','商品代金')">価格</th>
            </tr></thead><tbody>`;
            data.forEach(d => html += `<tr><td>26-${d['出品月(集計用)']}</td><td>${categorize(d['商品名'])}</td><td><a href="${d['商品URL']}" target="_blank" class="prod-link">${d['商品名']}</a></td><td>¥${parseInt(d['商品代金']||0).toLocaleString()}</td></tr>`);
            document.getElementById('monthlyStockTable').innerHTML = html + `</tbody></table>`;
        }

        function buildSalesTable() {
            let data = [...rawSales];
            if(sortConfig.table === 'sales') data = sortData(data, sortConfig.key, sortConfig.direction);

            let html = `<table><thead><tr>
                <th onclick="handleSort('sales','購入完了日')">完了日</th>
                <th onclick="handleSort('sales','商品名')">商品名</th>
                <th onclick="handleSort('sales','商品代金')">価格</th>
                <th onclick="handleSort('sales','販売利益')">利益</th>
            </tr></thead><tbody>`;
            data.forEach(d => html += `<tr><td>${d['購入完了日']}</td><td><a href="${d['商品URL']}" target="_blank" class="prod-link">${d['商品名']}</a></td><td>¥${parseInt(d['商品代金']||0).toLocaleString()}</td><td>¥${parseInt(d['販売利益']||0).toLocaleString()}</td></tr>`);
            document.getElementById('salesListTable').innerHTML = html + `</tbody></table>`;
        }

        function buildResaleTable() {
            const today = new Date('2026-08-11');
            let data = rawListing.filter(d => {
                const diff = Math.ceil(Math.abs(today - new Date(d['出品日時'])) / (1000 * 60 * 60 * 24));
                return diff >= 30;
            }).map(d => {
                const days = Math.ceil(Math.abs(today - new Date(d['出品日時'])) / (1000 * 60 * 60 * 24));
                return {...d, elapsed: days};
            });

            if(sortConfig.table === 'resale') data = sortData(data, sortConfig.key, sortConfig.direction);

            let html = `<table><thead><tr>
                <th onclick="handleSort('resale','出品日時')">出品日</th>
                <th onclick="handleSort('resale','elapsed')">経過</th>
                <th onclick="handleSort('resale','商品名')">商品名</th>
                <th onclick="handleSort('resale','商品代金')">価格</th>
            </tr></thead><tbody>`;
            data.forEach(d => html += `<tr><td>${d['出品日時']}</td><td style="color:red; font-weight:bold;">${d.elapsed}日</td><td><a href="${d['商品URL']}" target="_blank" class="prod-link">${d['商品名']}</a></td><td>¥${parseInt(d['商品代金']||0).toLocaleString()}</td></tr>`);
            document.getElementById('resaleTable').innerHTML = html + `</tbody></table>`;
        }

        // チャット描画
        function renderCharts(listing, sales) {
            const invM = {}; listing.forEach(d => { const label = `26-${d['出品月(集計用)']||'00'}`; invM[label] = (invM[label]||0)+1; });
            const sortedL = Object.keys(invM).sort();
            drawBar('inventoryChart', sortedL, sortedL.map(l => invM[l]), '#2196F3');

            const types = {};
            listing.forEach(d => { const cat = categorize(d['商品名']); types[cat] = (types[cat] || 0) + 1; });
            drawPie('typeChart', Object.keys(types), Object.values(types));

            const ships = {}; sales.forEach(d => { const m = d['配送の方法']||"未定"; ships[m] = (ships[m]||0)+1; });
            document.getElementById('shipping-list').innerHTML = Object.keys(ships).map(m => {
                const pct = Math.round((ships[m]/sales.length)*100);
                return `<div class="shipping-item">${m} (${pct}%)<div class="progress-bg"><div class="progress-bar" style="width:${pct}%"></div></div></div>`;
            }).join('');

            const profM = {}; sales.forEach(d => {
                const label = `26-${d['購入完了月(集計用)']||'01'}`;
                const val = parseInt((d['販売利益']||"0").replace(/[^0-9]/g,""))||0;
                profM[label] = (profM[label]||0)+val;
            });
            const sortedS = Object.keys(profM).sort();
            drawBar('salesChart', sortedS, sortedS.map(l => profM[l]), '#66BB6A');

            const top = [...listing].sort((a,b) => (parseInt(b['いいね！'])||0)-(parseInt(a['いいね！'])||0)).slice(0, 5);
            document.getElementById('likes-list').innerHTML = top.map(i => `
                <div class="top-product">
                    <span><a href="${i['商品URL']||'#'}" target="_blank" class="prod-link">${(i['商品名']||'').substring(0,10)}..</a></span>
                    <span>¥${parseInt(i['商品代金']||0).toLocaleString()} ❤️${i['いいね！']||0}</span>
                </div>
            `).join('');
        }

        function drawBar(id, labels, values, color) {
            if(charts[id]) charts[id].destroy();
            charts[id] = new Chart(document.getElementById(id), {
                type: 'bar', data: { labels, datasets: [{ data: values, backgroundColor: color, borderRadius: 8 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        function drawPie(id, labels, values) {
            if(charts[id]) charts[id].destroy();
            charts[id] = new Chart(document.getElementById(id), {
                type: 'doughnut', data: { labels, datasets: [{ data: values, backgroundColor: ['#2196F3', '#FF9800', '#66BB6A', '#F06292', '#FFEB3B', '#9C27B0', '#00BCD4'] }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } } }, cutout: '55%' }
            });
        }
    </script>
</body>
</html>
